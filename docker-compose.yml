services:
  meeting-db:
    image: mysql:8.0
    container_name: meeting-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: Meeting
      MYSQL_USER: meeting
      MYSQL_PASSWORD: meeting_password
      MYSQL_ROOT_PASSWORD: root_password
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3308:3306"
    volumes:
      - meeting-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  meeting-service:
    build:
      context: ./services/meeting
      dockerfile: Meeting-service/Dockerfile
    container_name: meeting-service
    environment:
      MEETING_DB_PASSWORD: meeting_password
      MEETING_DB_URL: jdbc:mysql://meeting-db:3306/Meeting
      QUARKUS_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      meeting-db:
        condition: service_healthy

  mysql-transcription:
    image: mysql:8.0
    container_name: mysql-transcription
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transcriptiondb
    ports:
      - "3307:3306"
    volumes:
      - mysql_transcription_data:/var/lib/mysql
    command:
      - --innodb-force-recovery=0
      - --innodb-fast-shutdown=0
      - --skip-external-locking
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  transcription-service:
    build:
      context: ./services/transcription/Transcription-service
      dockerfile: Dockerfile
    container_name: transcription-service
    ports:
      - "8082:8082"
    environment:
      QUARKUS_HTTP_PORT: 8082
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://mysql-transcription:3306/transcriptiondb
      QUARKUS_DATASOURCE_PORT: 3306
      QUARKUS_DATASOURCE_USERNAME: root
      QUARKUS_DATASOURCE_PASSWORD: root
      QUARKUS_DATASOURCE_DB_KIND: mysql
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      AI_SERVICE_URL: http://ai-service:8000
      QUARKUS_LOG_LEVEL: INFO
    depends_on:
      mysql-transcription:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: ./services/transcription/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8000:8000"
    environment:
      TRANSCRIPTION_SERVICE_URL: http://transcription-service:8082
    volumes:
      - ai_reunions_data:/app/Reunions
    restart: unless-stopped

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  meeting-db-data:
  mysql_transcription_data:
  ai_reunions_data:

