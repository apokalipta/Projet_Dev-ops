services:
  meeting-db:
    image: mysql:8.0
    container_name: meeting-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: Meeting
      MYSQL_USER: meeting
      MYSQL_PASSWORD: meeting_password
      MYSQL_ROOT_PASSWORD: root_password
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3308:3306"
    volumes:
      - meeting-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  meeting-service:
    build:
      context: .
      dockerfile: Meeting-service/Dockerfile
    container_name: meeting-service
    environment:
      MEETING_DB_PASSWORD: meeting_password
      MEETING_DB_URL: jdbc:mysql://meeting-db:3306/Meeting
      QUARKUS_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      meeting-db:
        condition: service_healthy

volumes:
  meeting-db-data:

