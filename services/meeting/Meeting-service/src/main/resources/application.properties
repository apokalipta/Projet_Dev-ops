# Meeting service datasource configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=meeting
quarkus.datasource.password=${MEETING_DB_PASSWORD}
quarkus.datasource.jdbc.url=${MEETING_DB_URL:jdbc:mysql://localhost:3306/Meeting}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.jdbc.max-size=16
quarkus.http.root-path=/
quarkus.rabbitmq.devservices.enabled=false
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

# CORS configuration pour permettre les requêtes depuis le frontend
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true