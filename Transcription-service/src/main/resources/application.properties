quarkus.application.name=transcription-service

quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:mysql://mysql-transcription:3306/transcriptiondb

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

quarkus.http.host=0.0.0.0
quarkus.http.port=8082

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi

# Configuration CORS pour permettre les requêtes depuis le frontend
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.credentials=true

